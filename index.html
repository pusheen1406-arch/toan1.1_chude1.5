 t5:{n:[G.soDoc,G.demSo,G.sapXep,G.lonNho,G.giuaHaiSo,G.kienThuc5,G.nhamCong,G.nhamTru,G.chuoi,G.soSanhPT,G.timPhepTinh,G.congHinh,G.truHinh,G.nhanDang,G.khoiNhanDang,G.quyLuat,G.daySo,G.hon3,G.dienDau,G.tachGop],a:[G.tachNam,G.lienKe,G.soOTrong,G.tongHinh,G.baiToanHai,G.dienDau2,G.soThieuHai,G.tinhDai,G.nhieuCach,G.demThieu,G.hangKho,G.xucXacDoi,G.soSanhHai,G.daySoCach]}
};
let LV='n';try{LV=localStorage.getItem('toan1_lv')==='a'?'a':'n'}catch(e){}
const TOPICS=[
 {id:'1',name:'Chủ đề 1: Các số từ 0 đến 10',sub:'Bài 1 – 6',items:[
   {id:'ss',name:'⚖️ Bài 4: So sánh số',type:'frame',src:'src-sosanh'},
   {id:'mm',name:'🎲 Bài 5: Mấy và mấy',type:'frame',src:'src-mayvamay',pull:true}]},
 {id:'2',name:'Chủ đề 2: Làm quen với một số hình phẳng',sub:'Bài 7 – 9 + phiếu tuần 2 – 3',items:[{id:'q',name:'📐 Luyện tập hình phẳng',type:'quiz',pool:'t2',title:'📐 Hình phẳng'}]},
 {id:'3',name:'Chủ đề 3: Phép cộng, phép trừ trong phạm vi 10',sub:'Bài 10 – 13 + phiếu tuần 11 – 16',items:[{id:'q',name:'➕ Luyện tập cộng, trừ',type:'quiz',pool:'t3',title:'➕➖ Cộng, trừ trong phạm vi 10'}]},
 {id:'4',name:'Chủ đề 4: Làm quen với một số hình khối',sub:'Bài 14 – 16 + phiếu tuần 1 – 2',items:[{id:'q',name:'🧊 Luyện tập hình khối, vị trí',type:'quiz',pool:'t4',title:'🧊 Hình khối, vị trí'}]},
 {id:'5',name:'Chủ đề 5: Ôn tập học kì 1',sub:'Bài 17 – 20 + phiếu tuần 17 – 18',items:[{id:'q',name:'📝 Ôn tập học kì 1',type:'quiz',pool:'t5',title:'📝 Ôn tập học kì 1'}]}
];

/* ======== động cơ luyện tập ======== */
const ST={};let Q=null;
function drawDice(n){$('dice').innerHTML=[...Array(9).keys()].map(i=>`<i class="${PIPS[n].includes(i)?'on':''}"></i>`).join('')}
function startQuiz(topic,item){
  const key=topic.id+item.id;ST[key]=ST[key]||{stars:0,streak:0,order:[]};
  Q={key,st:ST[key],pn:item.pool,vals:[],sel:0,done:false,cur:null,picked:[],on:new Set()};
  $('sc').innerHTML=`<header class="qh"><div class="score"><div id="dice" title="Bấm để gieo xúc xắc"></div><div class="bx" id="starbox"><small>⭐ Số câu đúng</small><b id="stars">0</b>/30</div><div class="bx" id="streakbox"><small>🔥 Chuỗi</small><b id="streak">0</b></div></div></header>`;
  $('stage').innerHTML=`
  <div class="card" id="ex"><span class="tag" id="tag"></span><div class="q" id="q"></div><div id="scene"></div><div id="eq"></div><div id="ans"></div><div id="padw"></div><div class="act" id="act"><button id="chk">✔ Kiểm tra</button><button id="next" style="background:var(--org);border-color:#c9740d">🎲 Bài mới</button></div><div id="msg"></div></div>`;
  $('dice').onclick=roll;$('next').onclick=roll;$('chk').onclick=check;
  $('stars').textContent=Q.st.stars%30;$('streak').textContent=Q.st.streak;drawDice(5);roll();
}
function roll(){
  const d=$('dice');d.classList.remove('roll');void d.offsetWidth;d.classList.add('roll');
  let k=0;const iv=setInterval(()=>{drawDice(R(1,6));if(++k>5)clearInterval(iv)},90);
  setTimeout(()=>{
    const P=POOLS[Q.pn][LV],ok='o'+LV;if(!Q.st[ok]||!Q.st[ok].length)Q.st[ok]=shuf([...P.keys()]);
    build(P[Q.st[ok].pop()]());drawDice(R(1,6));
  },420);
}
function build(ex){
  Q.cur=ex;Q.done=false;Q.sel=0;Q.picked=[];Q.on=new Set();
  $('tag').textContent=ex.tag+(LV==='a'?' 🚀 Nâng cao':'');$('q').textContent=ex.q;$('scene').innerHTML=ex.scene||'';$('msg').textContent='';
  $('eq').innerHTML='';$('ans').innerHTML='';$('padw').innerHTML='';
  const showChk=ex.kind==='eq'||ex.kind==='multi';$('chk').style.display=showChk?'':'none';
  if(ex.kind==='eq'){
    let n=0,h='';
    ex.eq.forEach(t=>{
      if(typeof t==='string')h+=`<span>${t}</span>`;
      else if(t.br)h+='<div class="brk"></div>';
      else if(t.b!==undefined){h+=`<button class="blank" data-i="${t.b}"></button>`;n=Math.max(n,t.b+1)}
      else if(t.f!==undefined)h+=`<span class="fix">${t.f}</span>`;
    });
    $('eq').innerHTML=`<div class="eq">${h}</div>`;Q.vals=Array(n).fill(null);
    document.querySelectorAll('.blank').forEach(b=>b.onclick=()=>{if(!Q.done){Q.sel=+b.dataset.i;paint()}});
    $('padw').innerHTML=`<div class="pad">${[...Array((ex.ans&&Math.max(...ex.ans)>12)?17:13).keys()].map(i=>`<button data-n="${i}">${i}</button>`).join('')}<button class="del" data-n="x">⌫</button></div>`;
    $('padw').querySelectorAll('button').forEach(b=>b.onclick=()=>press(b.dataset.n));paint();
  }else if(ex.kind==='choice'){
    $('ans').innerHTML=`<div class="opts">${ex.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.html}</button>`).join('')}</div>`;
    $('ans').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickOpt(b));
  }else if(ex.kind==='multi'){
    $('ans').innerHTML=`<div class="items">${ex.items.map((o,i)=>`<div class="it2" data-i="${i}">${o.html}${o.label?`<b>${o.label}</b>`:''}</div>`).join('')}</div>`;
    $('ans').querySelectorAll('.it2').forEach(b=>b.onclick=()=>{if(Q.done)return;const i=+b.dataset.i;Q.on.has(i)?Q.on.delete(i):Q.on.add(i);b.classList.toggle('on')});
  }else if(ex.kind==='order'){
    $('ans').innerHTML=`<div class="eq" id="got" style="min-height:58px"></div><div class="opts">${ex.nums.map(n=>`<button class="opt" data-n="${n}">${n}</button>`).join('')}</div>`;
    $('ans').querySelectorAll('.opt').forEach(b=>b.onclick=()=>pickOrder(b));
  }
}
function paint(){document.querySelectorAll('.blank').forEach(b=>{const i=+b.dataset.i;b.textContent=Q.vals[i]===null?'':Q.vals[i];b.classList.toggle('sel',!Q.done&&i===Q.sel)})}
function press(n){
  if(Q.done)return;document.querySelectorAll('.blank').forEach(b=>b.classList.remove('bad'));
  if(n==='x')Q.vals[Q.sel]=null;else{Q.vals[Q.sel]=+n;const nx=Q.vals.findIndex((v,i)=>v===null&&i!==Q.sel);if(nx>=0)Q.sel=nx}
  paint();
}
function say(ok,t){const m=$('msg');m.style.color=ok?'#1c7a3d':'#e5484d';m.textContent=t}
const PRAISE=['Giỏi quá! 🎉','Chính xác! ⭐','Tuyệt vời! 👏','Con làm đúng rồi! 🌟'];
function good(){Q.done=true;Q.st.stars++;Q.st.streak++;say(true,pick(PRAISE));ui(true)}
function bad(t){Q.st.streak=0;say(false,t||'Chưa đúng, con thử lại nhé! 💪');ui(false)}
function ui(ok){
  const s=Q.st.stars%30;$('stars').textContent=(Q.st.stars>0&&s===0)?30:s;$('streak').textContent=Q.st.streak;
  if(ok){bump('starbox');bump('streakbox');plus(Q.st.streak);if(Q.st.streak>0&&Q.st.streak%5===0&&Q.st.streak<=30)celebrate(Q.st.streak);else if(Q.st.stars%30===0)fireworks(Q.st.stars)}else bump('streakbox');
  if(ok&&Q.st.stars%30===0)setTimeout(()=>{$('stars').textContent=0},6000);
}
function check(){
  if(Q.done)return;const ex=Q.cur;
  if(ex.kind==='eq'){
    if(Q.vals.some(v=>v===null)){say(false,'Con điền hết các ô nhé! 😊');return}
    const ok=ex.ok?ex.ok(Q.vals):Q.vals.every((v,i)=>v===ex.ans[i]);const bs=[...document.querySelectorAll('.blank')];
    if(ok){bs.forEach(b=>b.className='blank ok');good()}
    else{bs.forEach((b,i)=>{b.className=(!ex.ok&&Q.vals[i]===ex.ans[i])?'blank ok':'blank bad'});bad()}
  }else if(ex.kind==='multi'){
    if(!Q.on.size){say(false,'Con bấm chọn các hình đúng nhé! 😊');return}
    const ok=ex.items.every((o,i)=>o.ok===Q.on.has(i));
    if(ok){document.querySelectorAll('.it2').forEach((b,i)=>{if(ex.items[i].ok)b.className='it2 ok'});good()}else bad('Chưa đúng hoàn toàn, con xem lại nhé! 💪');
  }
}
function pickOpt(b){
  if(Q.done)return;const o=Q.cur.opts[+b.dataset.i];
  if(o.v===Q.cur.ans){b.classList.add('ok');good()}else{b.classList.add('bad');bad()}
}
function pickOrder(b){
  if(Q.done)return;const n=+b.dataset.n,need=Q.cur.sorted[Q.picked.length];
  if(n===need){Q.picked.push(n);b.classList.add('used');$('got').innerHTML=Q.picked.map((x,i)=>`<span class="fix">${x}</span>${i<Q.picked.length-1?'<span>&lt;</span>':''}`).join('');
    if(Q.picked.length===Q.cur.sorted.length)good()}
  else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400);bad('Chưa đúng, hãy chọn số bé nhất còn lại! 💪')}
}
function bump(id){const e=$(id);e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}
function plus(n){const r=$('streakbox').getBoundingClientRect(),f=document.createElement('div');f.className='fly';f.textContent='+1 ⭐ Chuỗi '+n;f.style.left=(r.left+r.width/2)+'px';f.style.top=r.bottom+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1200)}
function fireworks(n){
  const c=$('fw'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const w=$('win');w.innerHTML='🎆 '+n+' câu đúng! Giỏi quá! 🎆';w.style.display='block';
  let P=[],t0=performance.now(),last=0;
  const burst=()=>{const cx=R(80,c.width-80),cy=R(60,c.height*.6),h=R(0,360);for(let i=0;i<70;i++){const a=Math.PI*2*i/70,v=2+Math.random()*4;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:`hsl(${h+R(-30,30)},100%,60%)`})}};
  (function loop(t){
    if(t-last>350&&t-t0<5000){burst();last=t}
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.012;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()});
    P=P.filter(p=>p.l>0);
    if(t-t0<5500||P.length)requestAnimationFrame(loop);else{x.clearRect(0,0,c.width,c.height);w.style.display='none'}
  })(t0);
}

/* ======== chúc mừng khi đạt chuỗi 5,10,...,30 ======== */
function celebrate(n){
 const CFG={5:[1000,300,60],10:[3000,450,70],15:[5000,350,80],20:[7000,250,100],25:[8000,200,120],30:[10000,140,140]},c=CFG[n];if(!c)return;
 const MSG={5:'Chuỗi 5! Tuyệt vời! 🎉',10:'Chuỗi 10! Giỏi quá đi! 🌟',15:'Chuỗi 15! Siêu đỉnh luôn! 🏆',20:'Chuỗi 20! Thiên tài toán học! 🚀',25:'Chuỗi 25! Xuất sắc quá! 👑',30:'Chuỗi 30! Vô địch toán lớp 1! 🥇'};
 const old=document.getElementById('cel');if(old)old.remove();
 const w=document.createElement('div');w.id='cel';w.style.cssText='position:fixed;inset:0;z-index:100;pointer-events:none';
 w.innerHTML='<canvas></canvas><div class="catb"><div class="bub">'+MSG[n]+'</div><div class="cat">'+pick(['😺','🐱','😸'])+'</div></div>';
 document.body.appendChild(w);
 const cv=w.querySelector('canvas'),x=cv.getContext('2d'),D=c[0],iv=c[1],cnt=c[2];cv.width=innerWidth;cv.height=innerHeight;
 let P=[],F=[],t0=performance.now(),last=-9999,catOff=false;
 const FL=['🌸','🌼','🌺','🌷','💮'];
 (function loop(t){const e=t-t0;
  if(e<D&&e-last>iv){last=e;const cx=R(80,cv.width-80),cy=R(60,cv.height*.55),h=R(0,360);for(let i=0;i<cnt;i++){const a=Math.PI*2*i/cnt,v=2+Math.random()*4;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:`hsl(${h+R(-30,30)},100%,60%)`})}}
  if(e<D&&Math.random()<.2+n/25)F.push({x:Math.random()*cv.width,y:-30,vx:Math.random()*2-1,vy:1.5+Math.random()*2.5,r:Math.random()*6,s:22+Math.random()*18,e:pick(FL)});
  if(e>=D&&!catOff){catOff=true;w.querySelector('.catb').style.opacity=0}
  x.clearRect(0,0,cv.width,cv.height);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.012;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()});
  x.globalAlpha=1;
  F.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.r+=.04;x.save();x.translate(f.x,f.y);x.rotate(f.r);x.font=f.s+'px serif';x.fillText(f.e,0,0);x.restore()});
  P=P.filter(p=>p.l>0);F=F.filter(f=>f.y<cv.height+40);
  if(e<D+1200&&(e<D||P.length||F.length))requestAnimationFrame(loop);else w.remove();
 })(t0);
}
window.celebrate=celebrate;
window.frameScore=(st,sk)=>{const a=$('stars'),b=$('streak');if(!a)return;const v=(st>0&&st%30===0)?30:st%30,ch=a.textContent!=v;a.textContent=v;b.textContent=sk;if(ch)bump('starbox');bump('streakbox');drawDice(R(1,6))};

/* ======== chọn chủ đề / bài ======== */
let curT=TOPICS[0],curI=TOPICS[0].items[0];
function render(){
  $('bT').textContent='📚 Chủ đề '+curT.id+(curT.items.length>1?' · '+curI.name.split(':')[0].replace(/^\S+\s/,''):'')+' ▾';
  const box=$('mT');box.innerHTML='<p>📚 Chọn chủ đề</p>';
  TOPICS.forEach(tp=>{
    const multi=tp.items.length>1,b=document.createElement('button');b.type='button';
    b.className=(tp===curT?'on':'')+(multi?' head':'');b.innerHTML=tp.name+`<small>${tp.sub}</small>`;
    const go=(it)=>{curT=tp;curI=it;save();$('ddT').classList.remove('open');render()};
    if(!multi)b.onclick=e=>{e.stopPropagation();go(tp.items[0])};
    box.appendChild(b);
    if(multi){const s=document.createElement('div');s.className='subs';
      tp.items.forEach(it=>{const c=document.createElement('button');c.type='button';c.className=(it===curI?'on':'');c.textContent=it.name;c.onclick=e=>{e.stopPropagation();go(it)};s.appendChild(c)});
      box.appendChild(s)}
  });
  $('tp').textContent=curI.type==='quiz'?curI.title:curI.name;applyLV();
  if(curI.type==='frame'){$('sc').innerHTML=curI.pull?'':`<header class="qh"><div class="score"><div id="dice" title="Bấm để gieo xúc xắc"></div><div class="bx" id="starbox"><small>⭐ Số câu đúng</small><b id="stars">0</b>/30</div><div class="bx" id="streakbox"><small>🔥 Chuỗi</small><b id="streak">0</b></div></div></header>`;if(!curI.pull){drawDice(R(1,6));$('dice').onclick=null}
    $('stage').innerHTML='<iframe class="fr" id="fr" allow="autoplay; microphone"></iframe>';
    $('fr').srcdoc=JSON.parse($(curI.src).textContent).replace('<head>','<head>'+INJ(curI));
  }else startQuiz(curT,curI);
}
const INJ=it=>`<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet"><style>html,body,body *{font-family:'Baloo 2','Nunito',system-ui,sans-serif!important}.kid-card{border:4px solid #bfe3f5!important;border-radius:24px!important;box-shadow:0 8px 0 #a9d6ee!important;max-width:100%!important}html,body{background:#d9f0fb!important}h1{display:none!important}body{padding:0!important}.wrap,#root{max-width:100%!important;width:100%!important;margin:0!important}${it.pull?'header{justify-content:flex-end!important;margin-bottom:6px!important}body{padding-top:6px!important}':''}</style><script>window.LV="${LV}"<\/script>`;
function fitStage(){const st=$('stage'),fr=$('fr');st.style.zoom='';document.documentElement.style.setProperty('--z',1);
 if(curI.type==='frame'&&fr){fr.style.height='';st.style.marginTop=(curI.pull&&innerWidth>=700)?-($('row2').offsetHeight-4)+'px':''}else st.style.marginTop=''}
setInterval(fitStage,400);addEventListener('resize',fitStage);
function applyLV(){document.body.classList.toggle('adv',LV==='a');$('lvb').setAttribute('aria-checked',LV==='a');$('lvn').className=LV==='n'?'on':'';$('lva').className=LV==='a'?'on':'';$('lv').style.display='flex'}
$('lvb').onclick=e=>{e.stopPropagation();LV=LV==='a'?'n':'a';try{localStorage.setItem('toan1_lv',LV)}catch(x){}applyLV();if(curI.type==='quiz')roll();else render()};
function save(){try{localStorage.setItem('toan1_sel',curT.id+'|'+curI.id)}catch(e){}}
function load(){try{const s=(localStorage.getItem('toan1_sel')||'').split('|');const t=TOPICS.find(x=>x.id===s[0]);if(t){curT=t;curI=t.items.find(i=>i.id===s[1])||t.items[0]}}catch(e){}}
$('bT').onclick=e=>{e.stopPropagation();$('ddT').classList.toggle('open')};
document.addEventListener('click',()=>$('ddT').classList.remove('open'));
load();render();
</script>
