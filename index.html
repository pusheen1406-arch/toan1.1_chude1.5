<!DOCTYPE html>
<html lang="vi-VN" translate="no">
<head>
<meta charset="UTF-8">

<title>Ôn Toán Lớp 1 - Tập một (Chủ đề 1 - 5)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9f0fb;--card:#fff;--ink:#1f3a4d;--blue:#2a9bd8;--org:#f59a23;--grn:#43b36b;--red:#e5484d;--pk:#fde0dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Baloo 2','Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);user-select:none;min-height:100vh}
.top{max-width:760px;margin:0 auto;padding:12px 12px 6px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.top h1{margin:0;font-size:1.5rem;color:var(--blue);font-weight:800}
.pickers{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:40}
.dd{position:relative}
.dd>button{font-family:inherit;font-weight:800;font-size:1.1rem;border:4px solid #7fc4e8;background:#fff;color:var(--blue);border-radius:16px;padding:4px 14px;cursor:pointer;box-shadow:0 4px 0 #a9d6ee;max-width:92vw}
.dd>button:active{transform:translateY(3px);box-shadow:0 1px 0 #a9d6ee}
.dd .menu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:260px;max-width:92vw;background:#fff;border:3px solid #7fc4e8;border-radius:16px;padding:8px;box-shadow:0 10px 24px rgba(31,58,77,.25);z-index:50}
.dd.open .menu{display:block}
.dd .menu p{margin:2px 0 6px;text-align:center;font-weight:800;color:var(--blue);font-size:.95rem}
.dd .menu button{display:block;width:100%;text-align:left;font-family:inherit;font-weight:700;font-size:1.05rem;border:2px solid #bfe3f5;background:#eef8fd;color:var(--ink);border-radius:12px;padding:6px 10px;margin-bottom:6px;cursor:pointer}
.dd .menu button.on{background:var(--blue);color:#fff;border-color:#1f7aa8}
.dd .menu .subs{margin:-2px 0 8px;padding:6px;border:2px solid #bfe3f5;border-radius:12px;background:#f6fcff}.dd .menu .subs button{margin:0 0 6px;background:#fff;font-size:1rem}.dd .menu .subs button:last-child{margin-bottom:0}.dd .menu .subs button.on{background:var(--blue);color:#fff;border-color:#1f7aa8}.dd .menu .head{cursor:default}.dd .menu small{display:block;font-weight:600;opacity:.8;font-size:.8rem}
#stage{max-width:760px;margin:0 auto;padding:6px 12px 24px}
iframe.fr{background:transparent!important;box-shadow:none!important;border-radius:0!important;width:100%;height:calc(100vh - 92px);height:calc(100dvh - 92px);min-height:620px;border:0;border-radius:18px;background:#fff;box-shadow:0 6px 0 #a9d6ee}
/* ---------- khu luyện tập ---------- */
header.qh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
h2.qt{margin:0;font-size:1.35rem;color:var(--blue);font-weight:800}
.score{display:flex;gap:10px;position:relative;align-items:center}
.score div.bx{background:#fff;border-radius:20px;padding:4px 16px;font-weight:800;border:4px solid #bfe3f5;text-align:center;line-height:1.1}
.score small{display:block;font-size:.85rem;color:#4b6b80;font-weight:700}
.score b{font-size:2.2rem;color:var(--org)}
#streakbox b{color:var(--red)}
.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.35) rotate(-4deg);background:#fff3c4}100%{transform:scale(1)}}
.fly{position:fixed;font-size:2.2rem;font-weight:800;color:#e89a00;pointer-events:none;z-index:80;animation:fly 1.1s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes fly{0%{opacity:1;transform:translate(-50%,0) scale(.6)}30%{transform:translate(-50%,-30px) scale(1.4)}100%{opacity:0;transform:translate(-50%,-110px) scale(1)}}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
#win{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:95;font-size:2.2rem;font-weight:800;color:#fff;text-shadow:0 3px 0 #e5484d,0 0 18px #000;display:none;pointer-events:none}
.card{background:var(--card);border-radius:24px;padding:20px 22px;border:4px solid #bfe3f5;box-shadow:0 8px 0 #a9d6ee}
#dice{width:68px;height:68px;border-radius:16px;background:#fff;border:4px solid var(--org);box-shadow:0 5px 0 #c9740d;cursor:pointer;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;gap:2px}
#dice:active{transform:translateY(4px);box-shadow:0 2px 0 #c9740d}
#dice i{border-radius:50%}#dice i.on{background:var(--red)}
.roll{animation:roll .6s}
@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}
.tag{display:inline-block;background:var(--org);color:#fff;border-radius:99px;padding:3px 18px;font-weight:700;margin-bottom:6px;font-size:1.2rem}
.q{font-size:1.7rem;line-height:1.3;font-weight:800;margin:6px 0 12px}
.scene{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;margin:8px 0}
.grp{min-width:110px;max-width:100%;min-height:120px;border-radius:26px;background:#e7f6ff;border:4px solid #9fd3ee;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;padding:10px 12px;font-size:2.6rem;line-height:1.1}
.grp.y{background:#fff7e0;border-color:#f1d58b}
.grp .x{opacity:.3;position:relative}.grp .x:after{content:"✖";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:1.4rem;color:var(--red);opacity:1}
.big{font-size:4.2rem;text-align:center;line-height:1.1}
.sp{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.sp.shapes{container-type:inline-size;gap:8px}
.sp.shapes svg{width:min(130px,calc((100cqw - 8px*(var(--c) - 1) - 1px)/var(--c)));height:auto}
.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;font-size:1.6rem;font-weight:700;margin-top:10px}
.brk{flex-basis:100%;height:0}
.blank,.fix{min-width:54px;height:54px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;border:4px solid #7fc4e8;background:#fff;color:var(--red);padding:0 6px;font-family:inherit}
.fix{background:#eef8fd;color:var(--blue);border-color:#bfe3f5}
.blank{cursor:pointer}
.blank.sel{border-color:var(--org);box-shadow:0 0 0 4px #fde2b4}
.blank.ok{background:#d9f5e1;border-color:var(--grn);color:#1c7a3d}
.blank.bad{background:var(--pk);border-color:var(--red);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}
.pad button,.act button{font-family:inherit;font-weight:800;font-size:1.4rem;border:0;border-bottom:4px solid #1f7aa8;background:var(--blue);color:#fff;border-radius:12px;padding:8px 0;cursor:pointer}
.pad button:active,.act button:active{transform:translateY(3px);border-bottom-width:1px}
.pad .del{background:#8a9aa6;border-color:#5f6e78}
.act{display:flex;gap:10px;justify-content:center;margin-top:12px}
.act button{padding:10px 26px;font-size:1.25rem}
#chk{background:var(--grn);border-color:#2a8a4c}
#msg{text-align:center;font-weight:800;font-size:1.3rem;margin-top:8px}#msg:empty{display:none}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px}
.opt{font-family:inherit;font-weight:800;font-size:1.5rem;min-width:84px;min-height:64px;padding:8px 18px;border-radius:16px;border:4px solid #7fc4e8;background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 #a9d6ee}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #a9d6ee}
.opt.ok{background:#d9f5e1;border-color:var(--grn);color:#1c7a3d}
.opt.bad{background:var(--pk);border-color:var(--red);animation:shake .4s}
.opt.used{opacity:.35;pointer-events:none}
.items{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:10px}
.it2{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 14px 8px;border-radius:18px;border:4px solid #bfe3f5;background:#f6fcff;cursor:pointer;flex:1 1 120px;max-width:150px;min-width:110px;box-sizing:border-box}
.it2 svg{width:100%;max-width:120px;height:auto}
.it2 b{font-size:1.6rem;color:var(--blue)}
.it2.on{border-color:var(--org);background:#fff3da;box-shadow:0 0 0 4px #fde2b4}
.it2.ok{border-color:var(--grn);background:#d9f5e1}
.pill{display:inline-block;padding:4px 14px;border-radius:99px;font-weight:800;font-size:1.5rem;background:#fde2b4;border:3px solid #f0b34a}
.seqrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;background:#fff7e0;border:4px solid #f1d58b;border-radius:20px;padding:10px}
.qm{width:46px;height:46px;border-radius:12px;border:4px dashed var(--red);color:var(--red);font-weight:800;font-size:1.9rem;display:flex;align-items:center;justify-content:center}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 2px #cbd5e1}
.lv{max-width:760px;margin:6px auto 0;padding:0 12px;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;color:#4b6b80}
.lv span{opacity:.55;transition:.2s}.lv span.on{opacity:1;color:var(--blue)}.lv #lva.on{color:#d9730d}
#lvb{width:64px;height:34px;border-radius:99px;border:4px solid #7fc4e8;background:#fff;position:relative;cursor:pointer;padding:0;transition:.2s}
#lvb i{position:absolute;top:2px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--blue);transition:.2s}
#lvb[aria-checked=true]{border-color:#f0b34a;background:#fff3da}#lvb[aria-checked=true] i{left:31px;background:var(--org)}
.tp{max-width:760px;margin:0 auto;padding:0 12px;font-size:1.5rem;font-weight:800;color:var(--blue)}
body.adv .card{border-color:#f1d58b;box-shadow:0 8px 0 #e8c46a}body.adv .tag{background:#d9730d}
header.qh{justify-content:flex-end;margin:0}
.row2{max-width:760px;margin:0 auto;padding:0 12px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:nowrap}
.top,.row2{max-width:760px!important}.row2{pointer-events:none;position:relative;z-index:5}.row2 .l2,.row2 #sc{pointer-events:auto}
.row2 .tp,.row2 .lv{padding:0;margin:0;max-width:none}.row2 .tp{font-size:1.25rem;white-space:nowrap}.l2{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1 1 0}#sc{flex:none}
@media(max-width:600px){.row2{justify-content:center;flex-wrap:wrap}}
@media(max-width:480px){.pad{grid-template-columns:repeat(5,1fr)}.top h1{font-size:1.15rem}.q{font-size:1.3rem}.card{padding:16px 12px}}
.catb{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);text-align:center;transition:opacity .6s}
.catb .bub{display:inline-block;background:#fff;border:4px solid #f0b34a;border-radius:20px;padding:6px 18px;font-weight:800;font-size:1.5rem;color:#d9730d;box-shadow:0 5px 0 #c9740d;margin-bottom:6px}
.catb .cat{font-size:6.5rem;line-height:1;animation:catb .5s ease-in-out infinite alternate}
@keyframes catb{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-18px) rotate(6deg)}}
</style>
</head>

          line-height: 1;\n            position: absolute;\n            transform: translate(-50%, -50%);\n        }\n    \u003c/style>\n\u003c/head>\n\u003cbody class=\"p-2 sm:p-6 min-h-screen\">\n    \u003cdiv id=\"root\">\u003c/div>\n\n    \u003cscript type=\"text/babel\">\n        const { useState, useEffect, useRef } = React;\n\n        const ADMIN_PASSWORD_DEFAULT = \"2002\";\n        const STORAGE_KEY_DATA = \"math1_app_data_v5\"+(window.LV==='a'?'a':'');\n        const STORAGE_KEY_PASS = \"math1_admin_pass_v5\";\n\n        const shuffleArray = (array) => {\n            const arr = [...array];\n            for (let i = arr.length - 1; i > 0; i--) {\n                const j = Math.floor(Math.random() * (i + 1));\n                [arr[i], arr[j]] = [arr[j], arr[i]];\n            }\n            return arr;\n        };\n\n        const availableIcons = ['🍎', '⭐', '🎈', '🍬', '🚗', '🐱', '🐟', '🌸', '⚽', '🧸'];\n\n        /* =========================================================\n           Xếp icon theo ô lưới để KHÔNG chồng lên nhau\n           - Chọn số cột/hàng phù hợp với số lượng\n           - Xáo trộn ô rồi lấy n ô đầu, trả về % tâm của mỗi ô\n           ========================================================= */\n        const generateGridPositions = (n) => {\n            if (n \u003c= 0) return [];\n            // Lưới đủ rộng rãi, thêm 1 cột và 1 hàng cho thoáng\n            const cols = Math.max(2, Math.ceil(Math.sqrt(n)) + 1);\n            const rows = Math.max(2, Math.ceil(n / cols) + 1);\n            const cells = [];\n            for (let r = 0; r \u003c rows; r++) {\n                for (let c = 0; c \u003c cols; c++) {\n                    // Bỏ qua vài ô ở góc để icon không dính sát viền\n                    if ((r === 0 || r === rows - 1) && (c === 0 || c === cols - 1)) continue;\n                    cells.push({ r, c });\n                }\n            }\n            // Nếu lọc góc mà thiếu ô thì bổ sung lại\n            if (cells.length \u003c n) {\n                for (let r = 0; r \u003c rows && cells.length \u003c n * 2; r++) {\n                    for (let c = 0; c \u003c cols && cells.length \u003c n * 2; c++) {\n                        if (!cells.find(x => x.r === r && x.c === c)) {\n                            cells.push({ r, c });\n                        }\n                    }\n                }\n            }\n            const picked = shuffleArray(cells).slice(0, n);\n            return picked.map(({ r, c }) => ({\n                top: ((r + 0.5) / rows) * 100,\n                left: ((c + 0.5) / cols) * 100\n            }));\n        };\n\n        const initialRawData = {\n            feature1: [\n                { question: \"Số mấy đây bé?\", audioText: \"Số năm\", options: [3, 5, 8], answer: 5 },\n                { question: \"Số mấy đây bé?\", audioText: \"Số không\", options: [0, 1, 10], answer: 0 },\n                { question: \"Số mấy đây bé?\", audioText: \"Số bảy\", options: [4, 7, 9], answer: 7 },\n                { question: \"Số mấy đây bé?\", audioText: \"Số mười\", options: [6, 8, 10], answer: 10 },\n                { question: \"Số mấy đây bé?\", audioText: \"Số ba\", options: [2, 3, 5], answer: 3 },\n                { question: \"Số mấy đây bé?\", audioText: \"Số tám\", options: [8, 6, 9], answer: 8 },\n                { question: \"Số mấy đây bé?\", audioText: \"Số một\", options: [1, 2, 4], answer: 1 },\n                { question: \"Số mấy đây bé?\", audioText: \"Số sáu\", options: [5, 6, 7], answer: 6 },\n                { question: \"Số mấy đây bé?\", audioText: \"Số chín\", options: [9, 8, 10], answer: 9 },\n                { question: \"Số mấy đây bé?\", audioText: \"Số bốn\", options: [2, 4, 6], answer: 4 }\n            ],\n            feature2: [\n                { type: 'max', count: 3 },\n                { type: 'min', count: 3 },\n                { type: 'compare', count: 2, subType: 'nhieu_hon' },\n                { type: 'compare', count: 2, subType: 'it_hon' }, N -> vi -> tên có Vietnam/Tiếng Việt\n           - Nếu vẫn không có, vẫn đọc với lang='vi-VN' để trình duyệt\n             tự chọn voice gần nhất (không hiện cảnh báo)\n           ========================================================= */\n        let cachedVoices = [];\n\n        const loadVoices = () => {\n            if (!('speechSynthesis' in window)) return [];\n            try { cachedVoices = window.speechSynthesis.getVoices() || []; }\n            catch (e) { cachedVoices = []; }\n            return cachedVoices;\n        };\n\n        if ('speechSynthesis' in window) {\n            loadVoices();\n            window.speechSynthesis.onvoiceschanged = loadVoices;\n        }\n\n        const pickVietnameseVoice = () => {\n            const voices = (cachedVoices && cachedVoices.length) ? cachedVoices : loadVoices();\n            if (!voices || !voices.length) return null;\n            // 1) Mã đúng vi-VN\n            let v = voices.find(x => (x.lang || '').toLowerCase() === 'vi-vn');\n            // 2) Bắt đầu bằng vi (vi, vi_VN, vi-...)\n            if (!v) v = voices.find(x => (x.lang || '').toLowerCase().replace('_', '-').startsWith('vi'));\n            // 3) Tên giọng có chứa Vietnam / Tiếng Việt\n            if (!v) v = voices.find(x => /vietnam|tiếng việt|tieng viet|hoai|linh|mai|nam minh/i.test(x.name || ''));\n            return v || null;\n        };\n\n        const speakText = (text) => {\n            if (!text) return;\n            if (!('speechSynthesis' in window)) return;\n            const synth = window.speechSynthesis;\n            synth.cancel();\n            setTimeout(() => {\n                const viVoice = pickVietnameseVoice();\n                const utterance = new SpeechSynthesisUtterance(text);\n                utterance.lang = 'vi-VN';\n                if (viVoice) utterance.voice = viVoice; // Ưu tiên giọng tiếng Việt\n                utterance.rate = 0.82;\n                utterance.pitch = 1;\n                utterance.volume = 1;\n                synth.speak(utterance);\n            }, 90);\n        };\n\n        const App = () => {\n            const [adminPassword, setAdminPassword] = useState(() => {\n                return localStorage.getItem(STORAGE_KEY_PASS) || ADMIN_PASSWORD_DEFAULT;\n            });\n\n            const [data, setData] = useState(() => {\n                const saved = localStorage.getItem(STORAGE_KEY_DATA);\n                if (saved) {\n                    try {\n                        const parsed = JSON.parse(saved);\n                        if (!parsed.feature4) parsed.feature4 = initialRawData.feature4;\n                        return parsed;\n                    } catch (e) {}\n                }\n                return initialRawData;\n            });\n\n            const [activeTab, setActiveTab] = useState('f1');\n\n            const [scores, setScores] = useState({ f1: 0, f2: 0, f3: 0, f4: 0 });\n            const [indices, setIndices] = useState({ f1: 0, f2: 0, f3: 0, f4: 0 });\n            const [isCompleted, setIsCompleted] = useState({ f1: false, f2: false, f3: false, f4: false });\n            const [feedbackState, _setFB] = useState({ status: null, msg: '' });\n            const setFeedbackState = (v) => {\n                if (v && v.status === 'correct') {\n                    window.__st = (window.__st || 0) + 1; window.__sk = (window.__sk || 0) + 1;\n                    try { parent.frameScore(window.__st, window.__sk); } catch (e) {}\n                    if (window.__sk % 5 === 0 && window.__sk \u003c= 30) { try { parent.celebrate(window.__sk); } catch (e) {} }\n                } else if (v && v.status === 'wrong') {\n                    window.__sk = 0; try { parent.frameScore(window.__st || 0, 0); } catch (e) {}\n                }\n                _setFB(v);\n            };\n            const [f2DataInstance, setF2DataInstance] = useState(null);\n            const [f4DataInstance, setF4DataInstance] = useState(null);\n\n            const [isAdminAuth, setIsAdminAuth] = useState(false);\n            const [passInput, setPassInput] = useState('');\n            const [loginError, setLoginError] = useState('');\n            const [newPassInput, setNewPassInput] = useState('');\n\n            /* =========================================================\n               PHẦN 2 – Số đúng/sai lệch nhau 1..3\n               ========================================================= */\n            const generateF2Numbers = (configItem) => {\n                const countBoxes = configItem.count;\n\n                if (configItem.type === 'max') {\n                    const maxVal = Math.floor(Math.random() * 4) + 7; // 7..10\n                    const numbers = [maxVal];\n                    const diffs = shuffleArray([1, 2, 3]);\n                    let i = 0;\n                    while (numbers.length \u003c countBoxes) {\n                        const diff = diffs[i % diffs.length];\n                        let val = maxVal - diff;\n                        if (val \u003c 0) val = 0;\n                        numbers.push(val);\n                        i++;\n                    }\n                    return shuffleArray(numbers);\n\n                } else if (configItem.type === 'min') {\n                    const minVal = Math.floor(Math.random() * 3); // 0..2\n                    const numbers = [minVal];\n                    const diffs = shuffleArray([1, 2, 3]);\n                    let i = 0;\n                    while (numbers.length \u003c countBoxes) {\n                        const diff = diffs[i % diffs.length];\n                        let val = minVal + diff;\n                        if (val > 10) val = 10;\n                        numbers.push(val);\n                        i++;\n                    }\n                    return shuffleArray(numbers);\n\n                } else if (configItem.type === 'compare') {\n                    if (configItem.subType === 'nhieu_hon') {\n                        const diff = Math.floor(Math.random() * 3) + 1;\n                        const bigger = Math.floor(Math.random() * (10 - diff)) + diff + 1;\n                        return [bigger, bigger - diff];\n                    } else if (configItem.subType === 'it_hon') {\n                        const diff = Math.floor(Math.random() * 3) + 1;\n                        const smaller = Math.floor(Math.random() * (10 - diff));\n                        return [smaller, smaller + diff];\n                    } else {\n                        const val = Math.floor(Math.random() * 9) + 1;\n                        return [val, val];\n                    }\n                }\n                return [0, 0, 0];\n            };\n\n            const buildItems = (n, padding = 0) => {\n                const positions = generateGridPositions(n);\n                return positions.map((pos, i) => ({\n                    id: i,\n                    top: pos.top,\n                    left: pos.left\n                }));\n            };\n\n            const generateF2Instance = (configItem) => {\n                const icon = availableIcons[Math.floor(Math.random() * availableIcons.length)];\n                const numbers = generateF2Numbers(configItem);\n\n                const boxes = numbers.map((num, idx) => ({\n                    id: idx,\n                    count: num,\n                    items: buildItems(num)\n                }));\n\n                let correctBoxId = 0;\n                if (configItem.type === 'max') {\n                    const maxVal = Math.max(...numbers);\n                    correctBoxId = boxes.find(b => b.count === maxVal).id;\n                } else if (configItem.type === 'min') {\n                    const minVal = Math.min(...numbers);\n                    correctBoxId = boxes.find(b => b.count === minVal).id;\n                } else if (configItem.type === 'compare') {\n                    if (configItem.subType === 'nhieu_hon') {\n                        correctBoxId = numbers[0] > numbers[1] ? boxes[0].id : boxes[1].id;\n                    } else if (configItem.subType === 'it_hon') {\n                        correctBoxId = numbers[0] \u003c numbers[1] ? boxes[0].id : boxes[1].id;\n                    } else {\n                        correctBoxId = -1;\n                    }\n                }\n\n                let promptText = \"\";\n                if (configItem.type === 'max') promptText = `Em hãy chọn khung có số lượng ${icon} NHIỀU NHẤT!`;\n                else if (configItem.type === 'min') promptText = `Em hãy chọn khung có số lượng ${icon} ÍT NHẤT!`;\n                else if (configItem.subType === 'nhieu_hon') promptText = `Khung nào có số lượng ${icon} NHIỀU HƠN?`;\n                else if (configItem.subType === 'it_hon') promptText = `Khung nào có số lượng ${icon} ÍT HƠN?`;\n                else promptText = `Hai khung có số lượng ${icon} BẰNG NHAU?`;\n\n                return { icon, boxes, correctBoxId, promptText, subType: configItem.subType, type: configItem.type };\n            };\n\n            /* =========================================================\n               PHẦN 4 – Đếm & Điền số (xen kẽ)\n               ========================================================= */\n            const generateF4Instance = (configItem) => {\n                const icon = availableIcons[Math.floor(Math.random() * availableIcons.length)];\n                const type = (configItem && configItem.type) ? configItem.type : (Math.random() > 0.5 ? 'count' : 'add');\n\n                if (type === 'count') {\n                    const count = Math.floor(Math.random() * 10) + 1; // 1..10\n                    const items = buildItems(count);\n                    const options = [count];\n                    let guard = 0;\n                    while (options.length \u003c 3 && guard++ \u003c 100) {\n                        const diff = Math.floor(Math.random() * 3) + 1;\n                        const opt = Math.random() > 0.5 ? count + diff : count - diff;\n                        if (opt >= 0 && opt \u003c= 10 && !options.includes(opt)) options.push(opt);\n                    }\n                    return {\n                        type: 'count', icon, count, items,\n                        options: shuffleArray(options),\n                        answer: count,\n                        promptText: `Đếm xem có bao nhiêu ${icon} trong khung?`\n                    };\n                } else {\n                    const a = Math.floor(Math.random() * 5) + 1;\n                    const b = Math.floor(Math.random() * (10 - a)) + 1;\n                    const total = a + b;\n                    const options = [total];\n                    let guard = 0;\n                    while (options.length \u003c 3 && guard++ \u003c 100) {\n                        const diff = Math.floor(Math.random() * 3) + 1;\n                        const opt = Math.random() > 0.5 ? total + diff : total - diff;\n                        if (opt >= 0 && opt \u003c= 10 && !options.includes(opt)) options.push(opt);\n                    }\n                    return {\n                        type: 'add', icon, a, b, total,\n                        options: shuffleArray(options),\n                        answer: total,\n                        promptText: `Điền số thích hợp vào ô trống:`\n                    };\n                }\n            };\n\n            useEffect(() => {\n                if (activeTab === 'f2' && data.feature2 && data.feature2[indices.f2]) {\n                    setF2DataInstance(generateF2Instance(data.feature2[indices.f2]));\n                    setFeedbackState({ status: null, msg: '' });\n                }\n            }, [indices.f2, activeTab, data.feature2]);\n\n            useEffect(() => {\n                if (activeTab === 'f4' && data.feature4 && data.feature4[indices.f4]) {\n                    setF4DataInstance(generateF4Instance(data.feature4[indices.f4]));\n                    setFeedbackState({ status: null, msg: '' });\n                }\n            }, [indices.f4, activeTab, data.feature4]);\n\n            useEffect(() => {\n                if (activeTab === 'f1' && data.feature1 && data.feature1[indices.f1]) {\n                    speakText(data.feature1[indices.f1].audioText);\n                    setFeedbackState({ status: null, msg: '' });\n                }\n            }, [indices.f1, activeTab]);\n\n            useEffect(() => {\n                if (activeTab === 'f3') {\n                    setFeedbackState({ status: null, msg: '' });\n                }\n            }, [indices.f3, activeTab]);\n\n            useEffect(() => {\n                localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(data));\n            }, [data]);\n\n            const handleAnswerF1 = (selectedOpt) => {\n                if (feedbackState.status === 'correct') return;\n                const currentQ = data.feature1[indices.f1];\n                if (selectedOpt === currentQ.answer) {\n                    setScores(prev => ({ ...prev, f1: prev.f1 + 1 }));\n                    setFeedbackState({ status: 'correct', msg: '' });\n                } else {\n                    setScores(prev => ({ ...prev, f1: prev.f1 - 1 }));\n                    setFeedbackState({ status: 'wrong', msg: 'Chưa đúng, bé chọn lại nhé!' });\n                }\n            };\n\n            const nextQuestionF1 = () => {\n                if (indices.f1 \u003c data.feature1.length - 1) {\n                    setIndices(prev => ({ ...prev, f1: prev.f1 + 1 }));\n                    setFeedbackState({ status: null, msg: '' });\n                } else {\n                    setIsCompleted(prev => ({ ...prev, f1: true }));\n                }\n            };\n\n            const handleAnswerF2 = (boxId) => {\n                if (feedbackState.status === 'correct') return;\n                let isCorrect = false;\n\n                if (f2DataInstance.type === 'max' || f2DataInstance.type === 'min') {\n                    if (boxId === f2DataInstance.correctBoxId) isCorrect = true;\n                } else {\n                    if (f2DataInstance.subType === 'bang_nhau') {\n                        isCorrect = (f2DataInstance.boxes[0].count === f2DataInstance.boxes[1].count);\n                    } else {\n                        if (boxId === f2DataInstance.correctBoxId) isCorrect = true;\n                    }\n                }\n\n                if (isCorrect) {\n                    setScores(prev => ({ ...prev, f2: prev.f2 + 1 }));\n                    setFeedbackState({ status: 'correct', msg: '' });\n                } else {\n                    setScores(prev => ({ ...prev, f2: prev.f2 - 1 }));\n                    setFeedbackState({ status: 'wrong', msg: 'Chưa chính xác, bé chọn lại nhé!' });\n                }\n            };\n\n            const nextQuestionF2 = () => {\n                if (indices.f2 \u003c data.feature2.length - 1) {\n                    setIndices(prev => ({ ...prev, f2: prev.f2 + 1 }));\n                } else {\n                    setIsCompleted(prev => ({ ...prev, f2: true }));\n                }\n            };\n\n            const handleAnswerF4 = (selectedOpt) => {\n                if (feedbackState.status === 'correct') return;\n                if (!f4DataInstance) return;\n                if (selectedOpt === f4DataInstance.answer) {\n                    setScores(prev => ({ ...prev, f4: prev.f4 + 1 }));\n                    setFeedbackState({ status: 'correct', msg: '' });\n                } else {\n                    setScores(prev => ({ ...prev, f4: prev.f4 - 1 }));\n                    setFeedbackState({ status: 'wrong', msg: 'Chưa đúng, bé đếm lại nhé!' });\n                }\n            };\n\n            const nextQuestionF4 = () => {\n                if (indices.f4 \u003c data.feature4.length - 1) {\n                    setIndices(prev => ({ ...prev, f4: prev.f4 + 1 }));\n                    setFeedbackState({ status: null, msg: '' });\n                } else {\n                    setIsCompleted(prev => ({ ...prev, f4: true }));\n                }\n            };\n\n            const refreshF1NewTheme = () => {\n                let rndNum = Math.floor(Math.random() * 11);\n                const newQ = {\n                    question: \"Số mấy đây bé?\",\n                    audioText: `Số ${rndNum}`,\n                    options: shuffleArray([rndNum, (rndNum + 1) % 11, (rndNum + 2) % 11]),\n                    answer: rndNum\n                };\n                setData(prev => {\n                    const newData = { ...prev };\n                    newData.feature1 = [...prev.feature1];\n                    newData.feature1[indices.f1] = newQ;\n                    return newData;\n                });\n                setFeedbackState({ status: null, msg: '' });\n                speakText(newQ.audioText);\n            };\n\n            const refreshF2NewTheme = () => {\n                if (data.feature2 && data.feature2[indices.f2]) {\n                    setF2DataInstance(generateF2Instance(data.feature2[indices.f2]));\n                    setFeedbackState({ status: null, msg: '' });\n                }\n            };\n\n            const refreshF3NewTheme = () => {\n                let n1 = Math.floor(Math.random() * 11);\n                let n2 = Math.floor(Math.random() * 11);\n                let ans = n1 > n2 ? '>' : n1 \u003c n2 ? '\u003c' : '=';\n                const newQ = window.advQ?window.advQ():{ num1: n1, num2: n2, answer: ans };\n                setData(prev => {\n                    const newData = { ...prev };\n                    newData.feature3 = [...prev.feature3];\n                    newData.feature3[indices.f3] = newQ;\n                    return newData;\n                });\n                setFeedbackState({ status: null, msg: '' });\n            };\n\n            const refreshF4NewTheme = () => {\n                if (data.feature4 && data.feature4[indices.f4]) {\n                    setF4DataInstance(generateF4Instance(data.feature4[indices.f4]));\n                    setFeedbackState({ status: null, msg: '' });\n                }\n            };\n\n            const handleAnswerF3 = (selectedSign) => {\n                if (feedbackState.status === 'correct') return;\n                const currentQ = data.feature3[indices.f3];\n                if (selectedSign === currentQ.answer) {\n                    setScores(prev => ({ ...prev, f3: prev.f3 + 1 }));\n                    setFeedbackState({ status: 'correct', msg: '' });\n                } else {\n                    setScores(prev => ({ ...prev, f3: prev.f3 - 1 }));\n                    setFeedbackState({ status: 'wrong', msg: 'Chưa đúng, bé chọn lại nhé!' });\n                }\n            };\n\n            const nextQuestionF3 = () => {\n                if (indices.f3 \u003c data.feature3.length - 1) {\n                    setIndices(prev => ({ ...prev, f3: prev.f3 + 1 }));\n                    setFeedbackState({ status: null, msg: '' });\n                } else {\n                    setIsCompleted(prev => ({ ...prev, f3: true }));\n                }\n            };\n\n            useEffect(() => {\n                const handleKeyDown = (e) => {\n                    if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;\n                    if (e.code === 'Space') {\n                        e.preventDefault();\n                        if (feedbackState.status === 'correct') {\n                            if (activeTab === 'f1') nextQuestionF1();\n                            else if (activeTab === 'f2') nextQuestionF2();\n                            else if (activeTab === 'f3') nextQuestionF3();\n                            else if (activeTab === 'f4') nextQuestionF4();\n                        }\n                    }\n                };\n                window.addEventListener('keydown', handleKeyDown);\n                             \u003cdiv className=\"bg-slate-50 p-4 rounded-2xl border-2 border-slate-200\">\n                                        \u003clabel className=\"block font-bold text-slate-700 mb-1 text-sm\">Đổi mật khẩu truy cập mới:\u003c/label>\n                                        \u003cdiv className=\"flex gap-2\">\n                                            \u003cinput\n                                                type=\"password\"\n                                                value={newPassInput}\n                                                onChange={(e) => setNewPassInput(e.target.value)}\n                                                placeholder=\"Mật khẩu mới...\"\n                                                className=\"flex-1 p-2 border-2 border-slate-300 rounded-xl font-bold text-sm bg-white\"\n                                            />\n                                            \u003cbutton\n                                                onClick={() => {\n                                                    if (newPassInput.trim()) {\n                                                        setAdminPassword(newPassInput.trim());\n                                                        localStorage.setItem(STORAGE_KEY_PASS, newPassInput.trim());\n                                                        setNewPassInput('');\n                                                        alert(\"Đổi mật khẩu thành công!\");\n                                                    } else {\n                                                        alert(\"Vui lòng nhập mật khẩu mới hợp lệ!\");\n                                                    }\n                                                }}\n                                                className=\"bg-slate-800 text-white font-bold px-4 py-2 rounded-xl text-sm btn-3d border-slate-950\"\n                                            >\n                                                Lưu Pass\n                                            \u003c/button>\n                                        \u003c/div>\n                                    \u003c/div>\n\n                                    \u003cdiv className=\"bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-200 space-y-4\">\n                                        \u003ch3 className=\"font-black text-emerald-800\">📊 Điều chỉnh số lượng câu hỏi (Từ 10 đến 50 câu):\u003c/h3>\n\n                                        \u003cdiv className=\"flex items-center justify-between\">\n                                            \u003cspan className=\"font-bold text-slate-700 text-sm\">Phần 1: Hiện có {data.feature1.length} câu\u003c/span>\n                                            \u003cinput\n                                                type=\"number\" min=\"10\" max=\"50\"\n                                                value={data.feature1.length}\n                                                onChange={(e) => {\n                                                    let val = Math.max(10, Math.min(50, Number(e.target.value)));\n                                                    let updated = [...data.feature1];\n                                                    while (updated.length \u003c val) {\n                                                        let rndNum = Math.floor(Math.random() * 11);\n                                                        updated.push({ question: \"Số mấy đây bé?\", audioText: `Số ${rndNum}`, options: shuffleArray([rndNum, (rndNum + 1) % 11, (rndNum + 2) % 11]), answer: rndNum });\n                                                    }\n                                                    updated = updated.slice(0, val);\n                                                    setData(prev => ({ ...prev, feature1: updated }));\n                                                    restartTab('f1');\n                                                }}\n                                                className=\"w-20 p-2 border-2 border-emerald-300 rounded-xl font-bold text-center bg-white\"\n                                            />\n                                        \u003c/div>\n\n                                        \u003cdiv className=\"flex items-center justify-between\">\n                                            \u003cspan className=\"font-bold text-slate-700 text-sm\">Phần 2: Hiện có {data.feature2.length} câu\u003c/span>\n                                            \u003cinput\n                                                type=\"number\" min=\"10\" max=\"50\"\n                                                value={data.feature2.length}\n                                                onChange={(e) => {\n                                                    let val = Math.max(10, Math.min(50, Number(e.target.value)));\n                                                    let updated = [...data.feature2];\n                                                    const types = ['max', 'min', 'compare'];\n                                                    const subTypes = ['nhieu_hon', 'it_hon', 'bang_nhau'];\n                                                    while (updated.length \u003c val) {\n                                                        let t = types[Math.floor(Math.random() * types.length)];\n                                                        updated.push({ type: t, count: t === 'compare' ? 2 : (Math.floor(Math.random() * 3) + 2), subType: subTypes[Math.floor(Math.random() * subTypes.length)] });\n                                                    }\n                                                    updated = updated.slice(0, val);\n                                                    setData(prev => ({ ...prev, feature2: updated }));\n                                                    restartTab('f2');\n                                                }}\n                                                className=\"w-20 p-2 border-2 border-emerald-300 rounded-xl font-bold text-center bg-white\"\n                                            />\n                                        \u003c/div>\n\n                                        \u003cdiv className=\"flex items-center justify-between\">\n                                            \u003cspan className=\"font-bold text-slate-700 text-sm\">Phần 3: Hiện có {data.feature3.length} câu\u003c/span>\n                                            \u003cinput\n                                                type=\"number\" min=\"10\" max=\"50\"\n                                                value={data.feature3.length}\n                                                onChange={(e) => {\n                                                    let val = Math.max(10, Math.min(50, Number(e.target.value)));\n                                                    let updated = [...data.feature3];\n                                                    while (updated.length \u003c val) {\n                                                        let n1 = Math.floor(Math.random() * 11);\n                                                        let n2 = Math.floor(Math.random() * 11);\n                                                        let ans = n1 > n2 ? '>' : n1 \u003c n2 ? '\u003c' : '=';\n                                                        updated.push({ num1: n1, num2: n2, answer: ans });\n                                                    }\n                                                    updated = updated.slice(0, val);\n                                                    setData(prev => ({ ...prev, feature3: updated }));\n                                                    restartTab('f3');\n                                                }}\n                                                className=\"w-20 p-2 border-2 border-emerald-300 rounded-xl font-bold text-center bg-white\"\n                                            />\n                                        \u003c/div>\n\n                                        \u003cdiv className=\"flex items-center justify-between\">\n                                            \u003cspan className=\"font-bold text-slate-700 text-sm\">Phần 4: Hiện có {data.feature4.length} câu\u003c/span>\n                                            \u003cinput\n                                                type=\"number\" min=\"10\" max=\"50\"\n                                                value={data.feature4.length}\n                                                onChange={(e) => {\n                                                    let val = Math.max(10, Math.min(50, Number(e.target.value)));\n                                                    let updated = [...data.feature4];\n                                                    while (updated.length \u003c val) {\n                                                        updated.push({ type: updated.length % 2 === 0 ? 'count' : 'add' });\n                                                    }\n                                                    updated = updated.slice(0, val);\n                                                    setData(prev => ({ ...prev, feature4: updated }));\n                                                    restartTab('f4');\n                                                }}\n                                                className=\"w-20 p-2 border-2 border-emerald-300 rounded-xl font-bold text-center bg-white\"\n                                            />\n                                        \u003c/div>\n                                    \u003c/div>\n                                    \u003cp className=\"text-xs text-slate-400 text-center font-bold\">Mọi thay đổi sẽ tự động lưu lại trên trình duyệt của bạn.\u003c/p>\n                                \u003c/div>\n                            )}\n                        \u003c/div>\n                    )}\n                \u003c/div>\n            );\n        };\n\n        const root = ReactDOM.createRoot(document.getElementById('root'));\n        root.render(\u003cApp />);\n    \u003c/script>\n\u003c/body>\n\u003c/html>"</script>
<script type="application/json" id="src-mayvamay">"\u003c!DOCTYPE html>\n\u003chtml lang=\"vi-VN\" translate=\"no\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003cmeta name=\"google\" content=\"notranslate\">\n\u003ctitle>Ôn Toán Lớp 1 - Mấy và mấy\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{--bg:#d9f0fb;--card:#fff;--ink:#1f3a4d;--blue:#2a9bd8;--org:#f59a23;--grn:#43b36b;--red:#e5484d;--pk:#fde0dc}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbody{margin:0;font-family:'Baloo 2','Nunito',system-ui,sans-serif;background:var(--bg);color:var(--ink);user-select:none;min-height:100vh;padding:12px}\n.wrap{max-width:760px;margin:0 auto}\nheader{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}\nh1{margin:0;font-size:1.5rem;color:var(--blue);font-weight:800}\n.score{display:flex;gap:10px;position:relative}\n.score div{background:#fff;border-radius:20px;padding:4px 16px;font-weight:800;border:4px solid #bfe3f5;text-align:center;line-height:1.1}\n.score small{display:block;font-size:.85rem;color:#4b6b80;font-weight:700}\n.score b{font-size:2.2rem;color:var(--org)}\n#streakbox b{color:var(--red)}\n.bump{animation:bump .6s}\n@keyframes bump{30%{transform:scale(1.35) rotate(-4deg);background:#fff3c4}100%{transform:scale(1)}}\n.fly{position:fixed;font-size:2.4rem;font-weight:800;color:#e89a00;pointer-events:none;z-index:50;animation:fly 1.1s ease-out forwards;text-shadow:0 2px 0 #fff}\n@keyframes fly{0%{opacity:1;transform:translate(-50%,0) scale(.6)}30%{transform:translate(-50%,-30px) scale(1.4)}100%{opacity:0;transform:translate(-50%,-110px) scale(1)}}\n#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}\n#win{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:70;font-size:2.4rem;font-weight:800;color:#fff;text-shadow:0 3px 0 #e5484d,0 0 18px #000;display:none;pointer-events:none}\n.card{background:var(--card);border-radius:24px;padding:16px;border:4px solid #bfe3f5;box-shadow:0 8px 0 #a9d6ee}\n.dicebox{text-align:center;padding:14px 0}\n#dice{width:73px;height:73px;border-radius:16px;background:#fff;border:4px solid var(--org);box-shadow:0 5px 0 #c9740d;cursor:pointer;display:inline-grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;gap:2px}\n#dice:active{transform:translateY(4px);box-shadow:0 2px 0 #c9740d}\n#dice i{border-radius:50%;background:transparent}\n#dice i.on{background:var(--red)}\n.roll{animation:roll .6s}\n@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(200deg) scale(1.2)}100%{transform:rotate(360deg) scale(1)}}\n.hint{font-size:1.05rem;margin-top:8px;color:#4b6b80}\n.tag{display:inline-block;background:var(--org);color:#fff;border-radius:99px;padding:2px 14px;font-weight:700;margin-bottom:6px}\n.q{font-size:1.7rem;line-height:1.3;font-weight:800;margin:6px 0 14px}\n#ex{padding:24px 22px}.tag{font-size:1.2rem;padding:3px 18px}\n.scene{display:flex;justify-content:center;gap:22px;flex-wrap:wrap;margin:8px 0}\n.tank{width:230px;min-height:120px;border-radius:50% 50% 44% 44%/40% 40% 60% 60%;background:#e7f6ff;border:4px solid #9fd3ee;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;padding:10px;font-size:2.6rem;line-height:1.1}\n.plate{width:280px;min-height:120px;border-radius:50%;background:#fff7e0;border:4px solid #f1d58b;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;padding:10px;font-size:2.6rem;gap:2px}\n.face{width:61px;height:61px;border-radius:12px;background:#fff;border:3px solid #f0b34a;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px}\n.face i{border-radius:50%}.face i.on{background:var(--red)}\n.eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px;font-size:1.6rem;font-weight:700;margin-top:10px}\n.blank,.fix{min-width:54px;height:54px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;border:4px solid #7fc4e8;background:#fff;color:var(--red);padding:0 6px}\n.fix{background:#eef8fd;color:var(--blue);border-color:#bfe3f5}\n.blank{cursor:pointer}\n.blank.sel{border-color:var(--org);box-shadow:0 0 0 4px #fde2b4}\n.blank.ok{background:#d9f5e1;border-color:var(--grn);color:#1c7a3d}\n.blank.bad{background:var(--pk);border-color:var(--red);animation:shake .4s}\n@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}\n.circle{width:150px;height:150px;border-radius:50%;background:#fdebc8;border:7px solid #4fb6ea;position:relative;margin:6px auto;display:flex;align-items:flex-end;justify-content:center;gap:14px;padding-bottom:16px}\n.circle:before{content:\"\";position:absolute;top:30px;bottom:0;left:50%;border-left:3px dashed #4fb6ea}\n.circle .top{position:absolute;top:-24px;left:50%;transform:translateX(-50%);background:#fff;border:4px solid #4fb6ea;border-radius:12px;font-weight:800;color:var(--blue);font-size:1.4rem;padding:0 12px}\n.circle .blank{min-width:44px;height:44px;font-size:1.5rem;background:#fff0}\n.tbl{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;border:3px dashed #7fc4e8;border-radius:14px;padding:34px 14px 14px;position:relative;margin:6px 0;width:100%;box-sizing:border-box}\n.tbl .top{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-weight:800;color:var(--blue);font-size:1.5rem}\n.tbl .blank,.tbl .fix{min-width:0;width:100%;height:50px;font-size:1.6rem}\n.ball{width:40px;height:40px;border-radius:50%;display:inline-block;border:2px solid #fff;margin:1px}\n.globe{width:280px;min-height:140px;border-radius:50%;background:#eaf8f1;border:5px solid #62c08a;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;padding:12px;margin:0 auto}\n.pad{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}\n.pad button,.act button{font-family:inherit;font-weight:800;font-size:1.4rem;border:0;border-bottom:4px solid #1f7aa8;background:var(--blue);color:#fff;border-radius:12px;padding:8px 0;cursor:pointer}\n.pad button:active,.act button:active{transform:translateY(3px);border-bottom-width:1px}\n.pad .del{background:#8a9aa6;border-color:#5f6e78}\n.act{display:flex;gap:10px;justify-content:center;margin-top:12px}\n.act button{padding:10px 26px;font-size:1.25rem}\n#chk{background:var(--grn);border-color:#2a8a4c}\n#msg{text-align:center;font-weight:800;font-size:1.3rem;min-height:34px;margin-top:8px}\n@media(max-width:480px){.pad{grid-template-columns:repeat(5,1fr)}h1{font-size:1.2rem}}\n#dice{width:68px;height:68px;border-radius:16px;border:4px solid var(--org);box-shadow:0 5px 0 #c9740d;padding:9px;display:grid;align-self:center}\n.score{align-items:center}header{flex-wrap:wrap}\n.tank,.plate,.globe{align-content:center}\n.face{width:84px;height:84px;border-radius:16px;border:4px solid #f0b34a;padding:10px}\n#msg{min-height:0}#msg:empty{display:none}#ex{padding:20px 22px 20px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n  \u003cheader>\u003ch1>🎲 Bài 5: Mấy và mấy\u003c/h1>\u003cdiv class=\"score\">\u003cdiv id=\"dice\" title=\"Bấm để gieo xúc xắc\">\u003c/div>\u003cdiv id=\"starbox\">\u003csmall>⭐ Số câu đúng\u003c/small>\u003cb id=\"stars\">0\u003c/b>/30\u003c/div>\u003cdiv id=\"streakbox\">\u003csmall>🔥 Chuỗi\u003c/small>\u003cb id=\"streak\">0\u003c/b>\u003c/div>\u003c/div>\u003c/header>\n  \u003cdiv class=\"card\" id=\"ex\" style=\"margin-top:16px;display:none\">\n    \u003cspan class=\"tag\" id=\"tag\">\u003c/span>\n    \u003cdiv class=\"q\" id=\"q\">\u003c/div>\n    \u003cdiv id=\"scene\">\u003c/div>\n    \u003cdiv id=\"eq\">\u003c/div>\n    \u003cdiv class=\"pad\" id=\"pad\">\u003c/div>\n    \u003cdiv class=\"act\">\u003cbutton id=\"chk\">✔ Kiểm tra\u003c/button>\u003cbutton id=\"next\" style=\"background:var(--org);border-color:#c9740d\">🎲 Bài mới\u003c/button>\u003c/div>\n    \u003cdiv id=\"msg\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\u003ccanvas id=\"fw\">\u003c/canvas>\u003cdiv id=\"win\">\u003c/div>\n\u003cscript>\nconst $=id=>document.getElementById(id);\nconst R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));\nconst pick=a=>a[R(0,a.length-1)];\nconst rep=(e,n)=>Array(n).fill(`\u003cspan class=\"it\">${e}\u003c/span>`).join('');\nconst PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};\nconst faceHTML=(n,cls)=>`\u003cdiv class=\"${cls}\">`+[...Array(9).keys()].map(i=>`\u003ci class=\"${PIPS[n].includes(i)?'on':''}\">\u003c/i>`).join('')+`\u003c/div>`;\nconst THEMES=[['🐠','bể cá'],['🐟','bể cá'],['🍪','đĩa bánh'],['🍬','đĩa kẹo'],['🍎','đĩa táo']];\nlet S={stars:0,streak:0},cur=null;\n\n/* ---------- các dạng bài ---------- */\n// mỗi bài: {tag,q,scene,eq:[token], ans:[...], ok(values)}\n// token: chuỗi => chữ; {b:i} => ô trống i; {f:n} => số cố định\nfunction themeScene(e,a,b){\n  const cont=e==='🐠'||e==='🐟'?'tank':'plate';\n  return `\u003cdiv class=\"scene\">\u003cdiv class=\"${cont}\">${rep(e,a)}\u003c/div>\u003cdiv class=\"${cont}\">${rep(e,b)}\u003c/div>\u003c/div>`;\n}\nconst TYPES=[\n function gop(){ // Bài 1 (Mai có / Nam có): gộp\n   const t=pick(THEMES),a=R(1,6),b=R(1,Math.min(6,10-a));\n   return{tag:'Gộp',q:'Đếm rồi điền số.',scene:themeScene(t[0],a,b),\n     eq:[{b:0},t[0],'và',{b:1},t[0],'được',{b:2},t[0]],ans:[a,b,a+b]};\n },\n function xucxac(){ // Luyện tập 1: gộp hai xúc xắc\n   const a=R(1,6),b=R(1,6);\n   return{tag:'Xúc xắc',q:'Đếm chấm trên hai xúc xắc, rồi cho biết có tất cả bao nhiêu chấm.',\n     scene:`\u003cdiv class=\"scene\">${faceHTML(a,'face')}${faceHTML(b,'face')}\u003c/div>`,\n     eq:[{b:0},'và',{b:1},'được',{b:2}],ans:[a,b,a+b]};\n },\n function tachHinh(){ // Khám phá: n gồm a và b (hai nhóm hình)\n   const n=R(4,10),a=R(1,n-1),b=n-a,t=pick([['🐠','🐟'],['🍪','🧇'],['🍎','🍐'],['🔴','🟡']]);\n   return{tag:'Tách số',q:`Có ${n} vật gồm hai loại. Đếm từng loại rồi điền số.`,\n     scene:`\u003cdiv class=\"scene\">\u003cdiv class=\"plate\" style=\"width:400px;max-width:100%;font-size:2.8rem\">${rep(t[0],a)}${rep(t[1],b)}\u003c/div>\u003c/div>`,\n     eq:[{f:n},'gồm',{b:0},'và',{b:1}],ans:[a,b],ok:v=>v[0]===a&&v[1]===b||v[0]===b&&v[1]===a};\n },\n function tachQue(){ // Hoạt động 2: tách que tính\n   const n=R(4,10);\n   return{tag:'Que tính',q:`Lấy ${n} que tính. Tách ${n} que tính đó thành hai nhóm. Điền số que tính ở mỗi nhóm.`,\n     scene:`\u003cdiv style=\"font-size:2.8rem;text-align:center\">${rep('🥢',n)}\u003c/div>`,\n     eq:[{circle:n}],ans:[0,0],ok:v=>v[0]>=1&&v[1]>=1&&v[0]+v[1]===n};\n },\n function bang(){ // Hoạt động 1: bảng tách\n   const n=R(4,6),rows=[];\n   for(let a=1;a\u003cn;a++)rows.push(a);\n   return{tag:'Bảng tách',q:`Tách ${n} thành hai số. Điền các số còn thiếu.`,scene:'',\n     eq:[{table:n,rows}],ans:rows.slice(1).map(a=>n-a),ok:v=>v.every((x,i)=>x===n-rows[i+1])};\n },\n function keo(){ // Luyện tập 3: máy kẹo\n   const n=R(4,10),r=R(1,n-1),y=n-r;\n   const balls=[...Array(r).fill('#e5484d'),...Array(y).fill('#f7b733')].sort(()=>Math.random()-.5);\n   return{tag:'Máy kẹo',q:'Đếm kẹo đỏ và kẹo vàng. Điền số.',\n     scene:`\u003cdiv class=\"globe\">${balls.map(c=>`\u003cspan class=\"ball\" style=\"background:${c}\">\u003c/span>`).join('')}\u003c/div>`,\n     eq:[{f:n},'viên gồm',{b:0},'đỏ và',{b:1},'vàng'],ans:[r,y]};\n }\n];\n\nconst NN=['Mai','Nam','Lan','Hà'];\nconst EXN=[\n function tachGop(){const n=R(4,10),a=R(1,n-1),g=Math.random()\u003c.5,t=pick(THEMES);\n   return{tag:'Tách – Gộp',q:g?`Gộp ${a} và ${n-a} được số mấy?`:`${n} gồm ${a} và mấy?`,scene:themeScene(t[0],a,n-a),eq:g?[{f:a},'và',{f:n-a},'được',{b:0}]:[{f:n},'gồm',{f:a},'và',{b:0}],ans:[g?n:n-a]}}\n];\nconst ADV=[\n function tachNam(){const k=pick([2,4]),b=R(1,Math.floor((10-k)/2)),a=b+k;\n   return{tag:'Bạn nam, bạn nữ',q:`Có ${a+b} bạn gồm bạn nam và bạn nữ. Số bạn nam nhiều hơn số bạn nữ ${k} bạn. Hỏi mỗi loại có mấy bạn?`,scene:'',eq:['Bạn nam:',{b:0},{br:1},'Bạn nữ:',{b:1}],ans:[a,b]}},\n function tachBa(){const n=R(5,10);\n   return{tag:'Tách thành ba số',q:`Tách ${n} thành ba số, mỗi số lớn hơn 0. Điền ba số em chọn.`,scene:'',eq:[{f:n},'gồm',{b:0},',',{b:1},'và',{b:2}],ans:[0,0,0],ok:v=>v.every(x=>x>=1)&&v[0]+v[1]+v[2]===n}},\n function nhieuCach(){const n=R(4,10);\n   return{tag:'Mấy cách tách',q:`Có mấy cách tách ${n} thành hai số lớn hơn 0? (Tách 1 và ${n-1} với ${n-1} và 1 là cùng một cách)`,scene:'',eq:[{b:0},'cách'],ans:[Math.floor(n/2)]}},\n function gopBa(){const a=R(1,4),b=R(1,4),c=R(1,Math.min(4,10-a-b)),t=pick(THEMES);\n   return{tag:'Gộp ba nhóm',q:`Có ba nhóm: ${a}, ${b} và ${c}. Gộp cả ba nhóm được mấy?`,scene:`\u003cdiv class=\"scene\">${[a,b,c].map(x=>`\u003cdiv class=\"plate\" style=\"width:160px;font-size:2rem\">${rep(t[0],x)}\u003c/div>`).join('')}\u003c/div>`,eq:[{f:a},'và',{f:b},'và',{f:c},'được',{b:0}],ans:[a+b+c]}}\n];\nconst cur_pool=()=>window.LV==='a'?ADV:TYPES.concat(EXN);\n\n/* ---------- hiển thị ---------- */\nlet vals=[],sel=0,done=false,order=[];\nfunction build(ex){\n  cur=ex;let blanks=0;\n  const blank=i=>`\u003cbutton class=\"blank\" data-i=\"${i}\">\u003c/button>`;\n  let html='';\n  ex.eq.forEach(t=>{\n    if(typeof t==='string')html+=`\u003cspan>${t}\u003c/span>`;\n    else if(t.b!==undefined){html+=blank(t.b);blanks=Math.max(blanks,t.b+1)}\n    else if(t.f!==undefined)html+=`\u003cspan class=\"fix\">${t.f}\u003c/span>`;\n    else if(t.circle){html+=`\u003cdiv class=\"circle\">\u003cspan class=\"top\">${t.circle}\u003c/span>${blank(0)}${blank(1)}\u003c/div>`;blanks=2}\n    else if(t.table){\n      html+=`\u003cdiv class=\"tbl\">\u003cspan class=\"top\">${t.table}\u003c/span>`+t.rows.map((a,i)=>`\u003cspan class=\"fix\">${a}\u003c/span>`+(i===0?`\u003cspan class=\"fix\">${t.table-a}\u003c/span>`:blank(i-1))).join('')+`\u003c/div>`;\n      blanks=t.rows.length-1;\n    }\n  });\n  $('eq').innerHTML=`\u003cdiv class=\"eq\">${html}\u003c/div>`;\n  $('tag').textContent=ex.tag+(window.LV==='a'?' 🚀 Nâng cao':'');$('q').textContent=ex.q;$('scene').innerHTML=ex.scene;\n  vals=Array(blanks).fill(null);sel=0;done=false;$('msg').textContent='';\n  document.querySelectorAll('.blank').forEach(b=>b.onclick=()=>{if(!done){sel=+b.dataset.i;paint()}});\n  const max=10+2;\n  $('pad').innerHTML=[...Array(max+1).keys()].map(n=>`\u003cbutton data-n=\"${n}\">${n}\u003c/button>`).join('')+`\u003cbutton class=\"del\" data-n=\"x\">⌫\u003c/button>`;\n  $('pad').querySelectorAll('button').forEach(b=>b.onclick=()=>press(b.dataset.n));\n  paint();\n}\nfunction paint(){\n  document.querySelectorAll('.blank').forEach(b=>{\n    const i=+b.dataset.i;b.textContent=vals[i]===null?'':vals[i];\n    b.classList.toggle('sel',!done&&i===sel);\n  });\n}\nfunction press(n){\n  if(done)return;\n  document.querySelectorAll('.blank').forEach(b=>b.classList.remove('bad'));\n  if(n==='x'){vals[sel]=null}\n  else{vals[sel]=+n;const nx=vals.findIndex((v,i)=>v===null&&i!==sel);if(nx>=0)sel=nx}\n  paint();\n}\nfunction check(){\n  if(done||!cur)return;\n  if(vals.some(v=>v===null)){$('msg').textContent='Con điền hết các ô nhé! 😊';return}\n  const ok=cur.ok?cur.ok(vals):vals.every((v,i)=>v===cur.ans[i]);\n  const bs=[...document.querySelectorAll('.blank')];\n  if(ok){\n    done=true;S.stars++;S.streak++;bs.forEach(b=>{b.className='blank ok'});\n    $('msg').style.color='#1c7a3d';$('msg').textContent=pick(['Giỏi quá! 🎉','Chính xác! ⭐','Tuyệt vời! 👏','Con làm đúng rồi! 🌟']);\n  }else{\n    S.streak=0;$('msg').style.color='#e5484d';$('msg').textContent='Chưa đúng, con thử lại nhé! 💪';\n    bs.forEach((b,i)=>{if(!cur.ok&&vals[i]===cur.ans[i])b.className='blank ok';else if(!cur.ok){b.className='blank bad'}else b.className='blank bad'});\n  }\n  $('stars').textContent=S.stars;$('streak').textContent=S.streak;\n    if(ok){bump('starbox');bump('streakbox');plus(S.streak);if(S.stars%30===0)fireworks();if(S.streak>0&&S.streak%5===0&&S.streak\u003c=30){try{parent.celebrate(S.streak)}catch(e){}}}else bump('streakbox');\n}\nfunction bump(id){const e=$(id);e.classList.remove('bump');void e.offsetWidth;e.classList.add('bump')}\nfunction plus(n){\n  const r=$('streakbox').getBoundingClientRect(),f=document.createElement('div');\n  f.className='fly';f.textContent='+1 ⭐ Chuỗi '+n;f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.bottom)+'px';\n  document.body.appendChild(f);setTimeout(()=>f.remove(),1200);\n}\nfunction fireworks(){\n  const c=$('fw'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;\n  const w=$('win');w.innerHTML='🎆 '+S.stars+' câu đúng! Giỏi quá! 🎆';w.style.display='block';\n  let P=[],t0=performance.now(),last=0;\n  const burst=()=>{const cx=R(80,c.width-80),cy=R(60,c.height*.6),h=R(0,360);\n    for(let i=0;i\u003c70;i++){const a=Math.PI*2*i/70,v=2+Math.random()*4;P.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:`hsl(${h+R(-30,30)},100%,60%)`})}};\n  (function loop(t){\n    if(t-last>350&&t-t0\u003c5000){burst();last=t}\n    x.clearRect(0,0,c.width,c.height);\n    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.l-=.012;x.globalAlpha=Math.max(p.l,0);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()});\n    P=P.filter(p=>p.l>0);\n    if(t-t0\u003c5500||P.length)requestAnimationFrame(loop);else{x.clearRect(0,0,c.width,c.height);w.style.display='none'}\n  })(t0);\n}\nfunction fit(){\n  document.querySelectorAll('.plate,.tank,.globe').forEach(f=>{\n    f.style.width='';f.style.minHeight='';\n    const maxW=f.parentElement.clientWidth;\n    for(let k=0;k\u003c40;k++){\n      const r=f.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,a=r.width/2-4,b=r.height/2-4;\n      let bad=false;\n      f.querySelectorAll('.it,.ball').forEach(i=>{const q=i.getBoundingClientRect();\n        [[q.left,q.top],[q.right,q.top],[q.left,q.bottom],[q.right,q.bottom]].forEach(([x,y])=>{if(((x-cx)/a)**2+((y-cy)/b)**2>1)bad=true})});\n      if(!bad)break;\n      f.style.width=Math.min(r.width+30,maxW)+'px';f.style.minHeight=(r.height+16)+'px';\n    }\n  });\n}\naddEventListener('resize',fit);\nfunction drawDice(n){$('dice').innerHTML=[...Array(9).keys()].map(i=>`\u003ci class=\"${PIPS[n].includes(i)?'on':''}\">\u003c/i>`).join('')}\nfunction roll(){\n  const d=$('dice');d.classList.remove('roll');void d.offsetWidth;d.classList.add('roll');\n  let k=0;const iv=setInterval(()=>{drawDice(R(1,6));if(++k>5)clearInterval(iv)},90);\n  setTimeout(()=>{\n    const PL=cur_pool();if(!order.length)order=[...PL.keys()].sort(()=>Math.random()-.5); // xoay vòng đủ mọi dạng\n    const f=PL[order.pop()];\n    build(f());drawDice(R(1,6));\n    $('ex').style.display='block';fit();\n  },620);\n}\n$('dice').onclick=roll;$('next').onclick=roll;$('chk').onclick=check;\ndrawDice(5);roll();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

<script>
const $=id=>document.getElementById(id);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const W10=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín','mười'];
const COL=['#e5484d','#f7b733','#2a9bd8','#43b36b','#f59a23','#e57bb0','#8e6bd8'];
const EMO=['🍎','🍐','🐠','🐥','🚗','🎈','🦆','🐰','🌼','🧸','🐟','🍊','🦋','⛵','🍬','⭐'];
const rep=(e,n,cls='')=>Array(n).fill(`<span class="${cls}">${e}</span>`).join('');
const grp=(e,n,y)=>`<div class="grp ${y?'y':''}">${n?rep(e,n):'<span style="font-size:1rem;color:#8a9aa6">(không có)</span>'}</div>`;
function shade(h,f){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=f<0?0:255,p=Math.abs(f);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1)}

/* ======== hình vẽ ======== */
const STAR=(()=>{let p=[];for(let i=0;i<10;i++){const r=i%2?13:32,a=-Math.PI/2+i*Math.PI/5;p.push((35+r*Math.cos(a)).toFixed(1)+','+(37+r*Math.sin(a)).toFixed(1))}return p.join(' ')})();
function shp(t,c,s=58){
  const b={tron:`<circle cx="35" cy="35" r="30" fill="${c}"/>`,vuong:`<rect x="7" y="7" width="56" height="56" fill="${c}"/>`,
   chunhat:`<rect x="2" y="17" width="66" height="36" fill="${c}"/>`,tamgiac:`<polygon points="35,6 66,62 4,62" fill="${c}"/>`,
   thang:`<polygon points="20,14 50,14 68,58 2,58" fill="${c}"/>`,sao:`<polygon points="${STAR}" fill="${c}"/>`}[t];
  return `<svg viewBox="0 0 70 70" width="${s}" height="${s}">${b}</svg>`;
}
const SN={tron:'hình tròn',vuong:'hình vuông',chunhat:'hình chữ nhật',tamgiac:'hình tam giác'};
function box(fw,fh,dp,c,sc=1){
  const dy=dp*.8,W=fw+dp,H=fh+dy;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W*sc}" height="${H*sc}"><polygon points="0,${dy} ${dp},0 ${fw+dp},0 ${fw},${dy}" fill="${shade(c,.35)}"/><polygon points="${fw},${dy} ${fw+dp},0 ${fw+dp},${fh} ${fw},${dy+fh}" fill="${shade(c,-.25)}"/><rect x="0" y="${dy}" width="${fw}" height="${fh}" fill="${c}"/></svg>`;
}
function cyl(c,sc=1){return `<svg viewBox="0 0 50 72" width="${50*sc}" height="${72*sc}"><path d="M5 12v48a20 9 0 0 0 40 0v-48z" fill="${c}"/><ellipse cx="25" cy="12" rx="20" ry="9" fill="${shade(c,.35)}"/></svg>`}
const K3={lap:c=>box(46,46,22,c),lapNho:c=>box(30,30,15,c),cao:c=>box(34,68,20,c),dai:c=>box(76,34,22,c),tru:c=>cyl(c)};
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function pips(n){return PIPS[n].map(i=>`<circle cx="${20+(i%3)*30}" cy="${20+Math.floor(i/3)*30}" r="9" fill="#1f3a4d"/>`).join('')}
function diceSVG(f,r,t){
  return `<svg viewBox="0 0 150 150" width="190" height="190">
  <g transform="matrix(1,0,0.35,-0.3,8,44)"><rect width="100" height="100" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>${pips(t)}</g>
  <g transform="matrix(0.35,-0.3,0,-1,108,144)"><rect width="100" height="100" fill="#dde3ea" stroke="#94a3b8" stroke-width="2"/>${pips(r)}</g>
  <g transform="translate(8,44)"><rect width="100" height="100" fill="#fff" stroke="#94a3b8" stroke-width="2"/>${pips(f)}</g></svg>`;
}
function stairSVG(h,lbl){
  const s=30,n=h.length,mx=Math.max(...h);let r='';
  h.forEach((k,c)=>{for(let i=0;i<k;i++)r+=`<rect x="${c*s+2}" y="${(mx-1-i)*s+2}" width="${s}" height="${s}" fill="#ffe14d" stroke="#b8860b" stroke-width="2"/>`});
  return `<div style="text-align:center"><svg viewBox="0 0 ${n*s+4} ${mx*s+4}" width="${(n*s+4)*1.3}" height="${(mx*s+4)*1.3}">${r}</svg>${lbl?`<div class="pill">${lbl}</div>`:''}</div>`;
